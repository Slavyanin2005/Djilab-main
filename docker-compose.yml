version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-djilab
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Dflbv2005
      POSTGRES_DB: djilab_db
    ports:
      - "5433:5432"
    volumes:
      - C:/postgres-data:/var/lib/postgresql/data
    networks:
      - djilab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Dflbv2005
    command: server /data --console-address ":9001"
    volumes:
      - C:/minio-data:/data
    networks:
      - djilab-network

  redis:
    image: redis:7-alpine
    container_name: djilab-redis
    ports:
      - "6379:6379"
    volumes:
      - C:/redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf  # ✅ Монтируем конфиг
    networks:
      - djilab-network
    # ✅ ИСПРАВЛЕНО: указываем путь к конфиг-файлу
    command: redis-server /usr/local/etc/redis/redis.conf

  backend:
    build: ../Djilab-backend
    container_name: djilab-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-lab1-secret-key-change-in-production
      - DB_NAME=djilab_db
      - DB_USER=admin
      - DB_PASSWORD=Dflbv2005
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ../Djilab-backend:/app
    networks:
      - djilab-network
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ../Djilab-frontend
    container_name: djilab-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../Djilab-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - djilab-network
    command: npm run dev -- --host 0.0.0.0

  adminer:
    image: adminer
    container_name: adminer-djilab
    ports:
      - "8080:8080"
    networks:
      - djilab-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-djilab
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - C:/prometheus-data:/prometheus
    networks:
      - djilab-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-djilab
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - C:/grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - djilab-network

networks:
  djilab-network:
    driver: bridge