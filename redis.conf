# redis.conf

# ✅ Ограничение памяти: 128MB (подбери под свои нужды)
maxmemory 128mb

# ✅ Стратегия эвикции: удалять старые ключи с TTL первыми
# allkeys-lru: удалять наименее недавно использованные ключи (любые)
# volatile-lru: удалять наименее недавно использованные ключи ТОЛЬКО с TTL (наш случай!)
maxmemory-policy volatile-lru

# ✅ Логирование эвикции (для отладки)
notify-keyspace-events "EAx"

# ✅ Сохранение на диск (опционально, для persistence)
save 900 1
save 300 10
save 60 10000

# ✅ Логирование в stdout (для docker)
loglevel notice